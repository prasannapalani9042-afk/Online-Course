{% extends "base.html" %}{% block title %}Create Account · CourseHub{% endblock %}{% block content %}<main class="auth-page"><section class="auth-card"><span class="eyebrow">YOUR LEARNING JOURNEY</span><h1>Let's get you started.</h1><p class="muted">Create your free student account.</p><form method="post" class="stack-form"><label>Full name<input name="name" required maxlength="120" autocomplete="name"></label><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password"><small>Use at least 8 characters.</small></label><button class="btn primary full">Create account</button></form><p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Login</a></p></section></main>{% endblock %}
